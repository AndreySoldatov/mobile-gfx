[package]
name = "mobile_gfx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.33.3"
log = "0.4.33"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = { version = "0.30.13", features = ["android-game-activity"] }
tracing = { version = "0.1.40", features = ["log"] }
raw-window-handle = "0.6.2"
image = "0.25.10"
slotmap = "1.1.1"
thiserror = "2.0.20"
bdf-parser = { path = "./bdf-parser" }
smallvec = "1.15.2"
env_logger = "0.11.11"
rand = "0.10.2"
rustc-hash = "2.1.3"

[features]
default = []
wgpu-counters = ["wgpu/counters"]
